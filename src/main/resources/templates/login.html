<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
<head>
  <title>Login</title>
</head>
<body>
<main class="auth-shell">
  <section class="card auth-card">
    <div class="card-body p-4">
      <p class="text-uppercase text-secondary small fw-semibold mb-1">Order Management</p>
      <h1 class="h4 mb-4">Sign in</h1>

      <div class="alert alert-danger" th:if="${param.error}">Invalid username or password.</div>
      <div class="alert alert-success" th:if="${param.logout}">You have been signed out.</div>

      <form th:action="@{/login}" method="post" data-submit-spinner>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <input class="form-control" id="username" name="username" type="text" autocomplete="username" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-success w-100" type="submit" data-spinner-target>
          <span class="spinner-border spinner-border-sm d-none me-2" aria-hidden="true"></span>
          <span data-label>Login</span>
        </button>
      </form>

      <div class="text-center mt-3">
        <a th:href="@{/register}">Create a user account</a>
      </div>

      <div class="small text-secondary mt-4">
        <div>Admin: admin / admin123</div>
        <div>User: user / user123</div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
