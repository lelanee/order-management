<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="auth-shell">
  <section class="card auth-card">
    <div class="card-body p-4">
      <p class="text-uppercase text-secondary small fw-semibold mb-1">Order Management</p>
      <h1 class="h4 mb-4">Sign in</h1>

      <div class="alert alert-danger" th:if="${param.error}">Invalid username or password.</div>
      <div class="alert alert-success" th:if="${param.logout}">You have been signed out.</div>

      <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <input class="form-control" id="username" name="username" type="text" autocomplete="username" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-success w-100" type="submit">Login</button>
      </form>

      <div class="small text-secondary mt-4">
        <div>Admin: admin / admin123</div>
        <div>User: user / user123</div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
