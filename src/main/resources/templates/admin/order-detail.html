<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
<head>
  <title>Order detail</title>
</head>
<body>
<main class="container py-4">
  <div class="mb-4">
    <a class="text-decoration-none" th:href="@{/admin/orders}"><i class="bi bi-arrow-left me-1"></i>Back to orders</a>
    <h1 class="h3 mt-2 mb-0">Order #<span th:text="${order.id}">1</span></h1>
  </div>

  <section class="card mb-4">
    <div class="card-body row g-3">
      <div class="col-md-4">
        <p class="text-secondary mb-1">Customer</p>
        <strong th:text="${order.customerName}">Customer</strong>
      </div>
      <div class="col-md-4">
        <p class="text-secondary mb-1">Phone</p>
        <strong th:text="${order.customerPhone}">Phone</strong>
      </div>
      <div class="col-md-4">
        <p class="text-secondary mb-1">Email</p>
        <strong th:text="${order.customerEmail} ?: 'N/A'">Email</strong>
      </div>
      <div class="col-md-8">
        <p class="text-secondary mb-1">Shipping address</p>
        <strong th:text="${order.shippingAddress}">Address</strong>
      </div>
      <div class="col-md-4">
        <p class="text-secondary mb-1">Status</p>
        <span th:replace="~{fragments/badges :: orderStatus(${order.status})}">PENDING</span>
      </div>
      <div class="col-12">
        <form class="row g-2 align-items-end" th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post" data-submit-spinner>
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <div class="col-md-4">
            <label class="form-label" for="status">Update status</label>
            <select class="form-select" id="status" name="status">
              <option th:each="status : ${statuses}"
                      th:value="${status}"
                      th:text="${status}"
                      th:selected="${status == order.status}">PENDING</option>
            </select>
          </div>
          <div class="col-md-auto">
            <button class="btn btn-primary" type="submit" data-spinner-target>
              <span class="spinner-border spinner-border-sm d-none me-2" aria-hidden="true"></span>
              <span data-label>Save status</span>
            </button>
          </div>
        </form>
      </div>
      <div class="col-12" th:if="${order.note}">
        <p class="text-secondary mb-1">Note</p>
        <span th:text="${order.note}">Note</span>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="table-responsive">
      <table class="table align-middle mb-0">
        <thead>
        <tr>
          <th>Product</th>
          <th>Quantity</th>
          <th>Unit price</th>
          <th>Line total</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${order.items}">
          <td th:text="${item.productName}">Product</td>
          <td th:text="${item.quantity}">1</td>
          <td th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'POINT', 0, 'NONE')} + ' ₫'">0 ₫</td>
          <td th:text="${#numbers.formatDecimal(item.lineTotal, 0, 'POINT', 0, 'NONE')} + ' ₫'">0 ₫</td>
        </tr>
        </tbody>
      </table>
    </div>
    <div class="card-footer bg-white d-flex justify-content-between">
      <strong>Total</strong>
      <strong th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'POINT', 0, 'NONE')} + ' ₫'">0 ₫</strong>
    </div>
  </section>
</main>
</body>
</html>
