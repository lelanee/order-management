<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order detail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-white border-bottom">
  <div class="container">
    <a class="navbar-brand fw-semibold" th:href="@{/admin/products}">Order Admin</a>
    <div class="navbar-nav ms-auto align-items-lg-center">
      <a class="nav-link" th:href="@{/admin/products}">Products</a>
      <a class="nav-link active" th:href="@{/admin/orders}">Orders</a>
      <form th:action="@{/logout}" method="post" class="ms-lg-3">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="btn btn-sm btn-outline-secondary" type="submit">Logout</button>
      </form>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

  <div class="mb-4">
    <a class="text-decoration-none" th:href="@{/admin/orders}">Back to orders</a>
    <h1 class="h3 mt-2 mb-0">Order #<span th:text="${order.id}">1</span></h1>
  </div>

  <section class="card mb-4">
    <div class="card-body row g-3">
      <div class="col-md-4">
        <p class="text-secondary mb-1">Customer</p>
        <strong th:text="${order.customerName}">Customer</strong>
      </div>
      <div class="col-md-4">
        <p class="text-secondary mb-1">Phone</p>
        <strong th:text="${order.customerPhone}">Phone</strong>
      </div>
      <div class="col-md-4">
        <p class="text-secondary mb-1">Email</p>
        <strong th:text="${order.customerEmail} ?: 'N/A'">Email</strong>
      </div>
      <div class="col-md-8">
        <p class="text-secondary mb-1">Shipping address</p>
        <strong th:text="${order.shippingAddress}">Address</strong>
      </div>
      <div class="col-md-4">
        <p class="text-secondary mb-1">Status</p>
        <span class="badge text-bg-warning" th:text="${order.status}">PENDING</span>
      </div>
      <div class="col-12">
        <form class="row g-2 align-items-end" th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <div class="col-md-4">
            <label class="form-label" for="status">Update status</label>
            <select class="form-select" id="status" name="status">
              <option th:each="status : ${statuses}"
                      th:value="${status}"
                      th:text="${status}"
                      th:selected="${status == order.status}">PENDING</option>
            </select>
          </div>
          <div class="col-md-auto">
            <button class="btn btn-primary" type="submit">Save status</button>
          </div>
        </form>
      </div>
      <div class="col-12" th:if="${order.note}">
        <p class="text-secondary mb-1">Note</p>
        <span th:text="${order.note}">Note</span>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="table-responsive">
      <table class="table align-middle mb-0">
        <thead>
        <tr>
          <th>Product</th>
          <th>Quantity</th>
          <th>Unit price</th>
          <th>Line total</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${order.items}">
          <td th:text="${item.productName}">Product</td>
          <td th:text="${item.quantity}">1</td>
          <td th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'COMMA', 0, 'POINT')} + ' VND'">0 VND</td>
          <td th:text="${#numbers.formatDecimal(item.lineTotal, 0, 'COMMA', 0, 'POINT')} + ' VND'">0 VND</td>
        </tr>
        </tbody>
      </table>
    </div>
    <div class="card-footer bg-white d-flex justify-content-between">
      <strong>Total</strong>
      <strong th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VND'">0 VND</strong>
    </div>
  </section>
</main>
</body>
</html>
