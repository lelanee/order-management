<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
<head>
  <title>Admin Orders</title>
</head>
<body>
<main class="container py-4">
  <section class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
    <div>
      <p class="text-uppercase text-secondary small fw-semibold mb-1">Order Management</p>
      <h1 class="h3 mb-0">Orders</h1>
    </div>
    <form class="d-flex gap-2" th:action="@{/admin/orders}" method="get">
      <select class="form-select" name="status">
        <option value="">All statuses</option>
        <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}"
                th:selected="${status == selectedStatus}">PENDING</option>
      </select>
      <button class="btn btn-primary" type="submit"><i class="bi bi-funnel me-1"></i>Filter</button>
    </form>
  </section>

  <section class="card">
    <div class="table-responsive" th:if="${!page.empty}">
      <table class="table table-hover align-middle mb-0">
        <thead>
        <tr>
          <th>ID</th>
          <th>Customer</th>
          <th>Contact</th>
          <th>Status</th>
          <th>Total</th>
          <th>Created</th>
          <th class="text-end">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${page.content}">
          <td th:text="${order.id}">1</td>
          <td th:text="${order.customerName}">Customer</td>
          <td>
            <div th:text="${order.customerPhone}">Phone</div>
            <small class="text-secondary" th:text="${order.customerEmail} ?: 'N/A'">Email</small>
          </td>
          <td><span th:replace="~{fragments/badges :: orderStatus(${order.status})}">PENDING</span></td>
          <td th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'POINT', 0, 'NONE')} + ' ₫'">0 ₫</td>
          <td th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}">2026-01-01</td>
          <td class="text-end">
            <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/orders/{id}(id=${order.id})}" title="Detail">
              <i class="bi bi-eye"></i>
            </a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
    <div class="text-center py-5" th:if="${page.empty}">
      <i class="bi bi-inbox fs-1 text-secondary"></i>
      <p class="mt-2 mb-0 text-secondary">No orders found</p>
    </div>
  </section>

  <nav class="mt-4" th:if="${page.totalPages > 1}" aria-label="Order pagination">
    <ul class="pagination justify-content-center">
      <li class="page-item" th:classappend="${page.first} ? 'disabled'">
        <a class="page-link" th:href="@{/admin/orders(page=${page.number - 1}, size=${page.size}, status=${selectedStatus})}">Previous</a>
      </li>
      <li class="page-item disabled" th:if="${page.number > 2}"><span class="page-link">...</span></li>
      <li class="page-item"
          th:each="pageNumber : ${#numbers.sequence(T(java.lang.Math).max(0, page.number - 2), T(java.lang.Math).min(page.totalPages - 1, page.number + 2))}"
          th:classappend="${pageNumber == page.number} ? 'active'">
        <a class="page-link" th:text="${pageNumber + 1}"
           th:href="@{/admin/orders(page=${pageNumber}, size=${page.size}, status=${selectedStatus})}">1</a>
      </li>
      <li class="page-item disabled" th:if="${page.number < page.totalPages - 3}"><span class="page-link">...</span></li>
      <li class="page-item" th:classappend="${page.last} ? 'disabled'">
        <a class="page-link" th:href="@{/admin/orders(page=${page.number + 1}, size=${page.size}, status=${selectedStatus})}">Next</a>
      </li>
    </ul>
  </nav>
</main>
</body>
</html>
