<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Orders</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-white border-bottom">
  <div class="container">
    <a class="navbar-brand fw-semibold" th:href="@{/admin/products}">Order Admin</a>
    <div class="navbar-nav ms-auto align-items-lg-center">
      <a class="nav-link" th:href="@{/admin/products}">Products</a>
      <a class="nav-link active" th:href="@{/admin/orders}">Orders</a>
      <form th:action="@{/logout}" method="post" class="ms-lg-3">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="btn btn-sm btn-outline-secondary" type="submit">Logout</button>
      </form>
    </div>
  </div>
</nav>

<main class="container py-4">
  <section class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
    <div>
      <p class="text-uppercase text-secondary small fw-semibold mb-1">Order Management</p>
      <h1 class="h3 mb-0">Orders</h1>
    </div>
    <form class="d-flex gap-2" th:action="@{/admin/orders}" method="get">
      <select class="form-select" name="status">
        <option value="">All statuses</option>
        <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}"
                th:selected="${status == selectedStatus}">PENDING</option>
      </select>
      <button class="btn btn-primary" type="submit">Filter</button>
    </form>
  </section>

  <section class="card">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
        <tr>
          <th>ID</th>
          <th>Customer</th>
          <th>Contact</th>
          <th>Status</th>
          <th>Total</th>
          <th>Created</th>
          <th class="text-end">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(orders)}">
          <td colspan="7" class="text-center text-secondary py-5">No orders found</td>
        </tr>
        <tr th:each="order : ${orders}">
          <td th:text="${order.id}">1</td>
          <td th:text="${order.customerName}">Customer</td>
          <td>
            <div th:text="${order.customerPhone}">Phone</div>
            <small class="text-secondary" th:text="${order.customerEmail}">Email</small>
          </td>
          <td><span class="badge text-bg-warning" th:text="${order.status}">PENDING</span></td>
          <td th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VND'">0 VND</td>
          <td th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}">2026-01-01</td>
          <td class="text-end">
            <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/orders/{id}(id=${order.id})}">Detail</a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>
</body>
</html>
