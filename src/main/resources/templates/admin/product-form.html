<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${pageTitle}">Product form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-white border-bottom">
  <div class="container">
    <a class="navbar-brand fw-semibold" th:href="@{/admin/products}">Order Admin</a>
    <div class="navbar-nav ms-auto align-items-lg-center">
      <a class="nav-link active" th:href="@{/admin/products}">Products</a>
      <a class="nav-link" th:href="@{/admin/orders}">Orders</a>
      <form th:action="@{/logout}" method="post" class="ms-lg-3">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="btn btn-sm btn-outline-secondary" type="submit">Logout</button>
      </form>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div class="mb-4">
    <a class="text-decoration-none" th:href="@{/admin/products}">Back to products</a>
    <h1 class="h3 mt-2 mb-0" th:text="${pageTitle}">Product form</h1>
  </div>

  <form class="card form-card" th:action="${formAction}" method="post" th:object="${product}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <div class="card-body row g-3">
      <div class="col-md-6">
        <label class="form-label" for="name">Name</label>
        <input class="form-control" id="name" type="text" th:field="*{name}">
        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="price">Price</label>
        <input class="form-control" id="price" type="text" inputmode="decimal" th:field="*{price}">
        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="stockQuantity">Stock quantity</label>
        <input class="form-control" id="stockQuantity" type="text" inputmode="numeric" th:field="*{stockQuantity}">
        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('stockQuantity')}" th:errors="*{stockQuantity}"></div>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="imageUrl">Image URL</label>
        <input class="form-control" id="imageUrl" type="url" th:field="*{imageUrl}">
        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}"></div>
      </div>
      <div class="col-12">
        <label class="form-label" for="description">Description</label>
        <textarea class="form-control" id="description" rows="4" th:field="*{description}"></textarea>
        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
      </div>
      <div class="col-12">
        <div class="form-check">
          <input class="form-check-input" id="active" type="checkbox" th:field="*{active}">
          <label class="form-check-label" for="active">Active</label>
        </div>
      </div>
    </div>
    <div class="card-footer bg-white d-flex justify-content-end gap-2">
      <a class="btn btn-outline-secondary" th:href="@{/admin/products}">Cancel</a>
      <button class="btn btn-success" type="submit">Save product</button>
    </div>
  </form>
</main>
</body>
</html>
