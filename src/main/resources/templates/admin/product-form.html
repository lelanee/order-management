<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
<head>
  <title th:text="${pageTitle}">Product form</title>
</head>
<body>
<main class="container py-4">
  <div class="mb-4">
    <a class="text-decoration-none" th:href="@{/admin/products}"><i class="bi bi-arrow-left me-1"></i>Back to products</a>
    <h1 class="h3 mt-2 mb-0" th:text="${pageTitle}">Product form</h1>
  </div>

  <form class="card form-card" th:action="${formAction}" method="post" th:object="${product}" data-submit-spinner>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <div class="card-body row g-3">
      <div class="col-md-6">
        <label class="form-label" for="name">Name</label>
        <input class="form-control" id="name" type="text" th:field="*{name}">
        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="price">Price</label>
        <input class="form-control" id="price" type="text" inputmode="decimal" th:field="*{price}">
        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="stockQuantity">Stock quantity</label>
        <input class="form-control" id="stockQuantity" type="text" inputmode="numeric" th:field="*{stockQuantity}">
        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('stockQuantity')}" th:errors="*{stockQuantity}"></div>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="imageUrl">Image URL</label>
        <input class="form-control" id="imageUrl" type="url" th:field="*{imageUrl}">
        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}"></div>
      </div>
      <div class="col-12">
        <label class="form-label" for="description">Description</label>
        <textarea class="form-control" id="description" rows="4" th:field="*{description}"></textarea>
        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
      </div>
      <div class="col-12">
        <div class="form-check form-switch">
          <input class="form-check-input" id="active" type="checkbox" th:field="*{active}">
          <label class="form-check-label" for="active">Active</label>
        </div>
      </div>
    </div>
    <div class="card-footer bg-white d-flex justify-content-end gap-2">
      <a class="btn btn-outline-secondary" th:href="@{/admin/products}">Cancel</a>
      <button class="btn btn-success" type="submit" data-spinner-target>
        <span class="spinner-border spinner-border-sm d-none me-2" aria-hidden="true"></span>
        <span data-label>Save product</span>
      </button>
    </div>
  </form>
</main>
</body>
</html>
