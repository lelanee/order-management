<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Products</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-white border-bottom">
  <div class="container">
    <a class="navbar-brand fw-semibold" th:href="@{/admin/products}">Order Admin</a>
    <div class="navbar-nav ms-auto align-items-lg-center">
      <a class="nav-link active" th:href="@{/admin/products}">Products</a>
      <a class="nav-link" th:href="@{/admin/orders}">Orders</a>
      <form th:action="@{/logout}" method="post" class="ms-lg-3">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="btn btn-sm btn-outline-secondary" type="submit">Logout</button>
      </form>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

  <section class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
    <div>
      <p class="text-uppercase text-secondary small fw-semibold mb-1">Product Management</p>
      <h1 class="h3 mb-0">Products</h1>
    </div>
    <a class="btn btn-success" th:href="@{/admin/products/new}">Add product</a>
  </section>

  <form class="card mb-4" th:action="@{/admin/products}" method="get" th:object="${filter}">
    <div class="card-body row g-3 align-items-end">
      <div class="col-md-6">
        <label class="form-label" for="name">Name</label>
        <input class="form-control" id="name" type="text" th:field="*{name}" placeholder="Search by product name">
      </div>
      <div class="col-md-3">
        <label class="form-label" for="active">Status</label>
        <select class="form-select" id="active" th:field="*{active}">
          <option value="">All</option>
          <option value="true">Active</option>
          <option value="false">Inactive</option>
        </select>
      </div>
      <div class="col-md-3 d-flex gap-2">
        <input type="hidden" name="page" value="0">
        <input type="hidden" th:field="*{size}">
        <button class="btn btn-primary flex-fill" type="submit">Filter</button>
        <a class="btn btn-outline-secondary" th:href="@{/admin/products}">Reset</a>
      </div>
    </div>
  </form>

  <section class="card">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
        <tr>
          <th scope="col">ID</th>
          <th scope="col">Name</th>
          <th scope="col">Price</th>
          <th scope="col">Stock</th>
          <th scope="col">Status</th>
          <th scope="col" class="text-end">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(products)}">
          <td colspan="6" class="text-center text-secondary py-5">No products found</td>
        </tr>
        <tr th:each="product : ${products}">
          <td class="text-secondary" th:text="${product.id}">1</td>
          <td>
            <div class="fw-semibold" th:text="${product.name}">Product name</div>
          </td>
          <td th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' VND'">0 VND</td>
          <td th:text="${product.stockQuantity}">0</td>
          <td>
            <span class="badge text-bg-success" th:if="${product.active}">Active</span>
            <span class="badge text-bg-secondary" th:unless="${product.active}">Inactive</span>
          </td>
          <td class="text-end">
            <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/products/{id}(id=${product.id})}">Detail</a>
            <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/products/{id}/edit(id=${product.id})}">Edit</a>
            <form class="d-inline" th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
    <div class="card-footer bg-white d-flex flex-wrap align-items-center justify-content-between gap-3"
         th:if="${productPage.totalPages > 0}">
      <span class="text-secondary small">
        Showing page <span th:text="${productPage.page + 1}">1</span>
        of <span th:text="${productPage.totalPages}">1</span>
        (<span th:text="${productPage.totalElements}">0</span> products)
      </span>
      <nav aria-label="Product pagination" th:if="${productPage.totalPages > 1}">
        <ul class="pagination pagination-sm mb-0">
          <li class="page-item" th:classappend="${productPage.page == 0} ? 'disabled'">
            <a class="page-link"
               th:href="@{/admin/products(name=${filter.name},active=${filter.active},page=${productPage.page - 1},size=${productPage.size})}">
              Previous
            </a>
          </li>
          <li class="page-item"
              th:each="pageNumber : ${#numbers.sequence(0, productPage.totalPages - 1)}"
              th:classappend="${pageNumber == productPage.page} ? 'active'">
            <a class="page-link"
               th:text="${pageNumber + 1}"
               th:href="@{/admin/products(name=${filter.name},active=${filter.active},page=${pageNumber},size=${productPage.size})}">1</a>
          </li>
          <li class="page-item" th:classappend="${productPage.last} ? 'disabled'">
            <a class="page-link"
               th:href="@{/admin/products(name=${filter.name},active=${filter.active},page=${productPage.page + 1},size=${productPage.size})}">
              Next
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </section>
</main>
</body>
</html>
