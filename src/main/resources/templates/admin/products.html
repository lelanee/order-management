<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
<head>
  <title>Admin Products</title>
</head>
<body>
<main class="container py-4">
  <section class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
    <div>
      <p class="text-uppercase text-secondary small fw-semibold mb-1">Product Management</p>
      <h1 class="h3 mb-0">Products</h1>
    </div>
    <a class="btn btn-success" th:href="@{/admin/products/new}">
      <i class="bi bi-plus-lg me-1"></i>Add product
    </a>
  </section>

  <form class="card mb-4" th:action="@{/admin/products}" method="get">
    <div class="card-body row g-3 align-items-end">
      <div class="col-md-6">
        <label class="form-label" for="name">Name</label>
        <input class="form-control" id="name" name="name" type="text" th:value="${name}" placeholder="Search by product name">
      </div>
      <div class="col-md-3">
        <label class="form-label" for="active">Status</label>
        <select class="form-select" id="active" name="active">
          <option value="">All</option>
          <option value="true" th:selected="${active == true}">Active</option>
          <option value="false" th:selected="${active == false}">Inactive</option>
        </select>
      </div>
      <div class="col-md-3 d-flex gap-2">
        <input type="hidden" name="page" value="0">
        <input type="hidden" name="size" th:value="${page.size}">
        <button class="btn btn-primary flex-fill" type="submit"><i class="bi bi-funnel me-1"></i>Filter</button>
        <a class="btn btn-outline-secondary" th:href="@{/admin/products}">Reset</a>
      </div>
    </div>
  </form>

  <section class="card">
    <div class="table-responsive" th:if="${!page.empty}">
      <table class="table table-hover align-middle mb-0">
        <thead>
        <tr>
          <th scope="col">ID</th>
          <th scope="col">Name</th>
          <th scope="col">Price</th>
          <th scope="col">Stock</th>
          <th scope="col">Status</th>
          <th scope="col" class="text-end">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${page.content}">
          <td class="text-secondary" th:text="${product.id}">1</td>
          <td><div class="fw-semibold" th:text="${product.name}">Product name</div></td>
          <td th:text="${#numbers.formatDecimal(product.price, 0, 'POINT', 0, 'NONE')} + ' ₫'">0 ₫</td>
          <td th:text="${product.stockQuantity}">0</td>
          <td>
            <span class="badge text-bg-success" th:if="${product.active}">Active</span>
            <span class="badge text-bg-secondary" th:unless="${product.active}">Inactive</span>
          </td>
          <td class="text-end">
            <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/products/{id}(id=${product.id})}" title="Detail">
              <i class="bi bi-eye"></i>
            </a>
            <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/products/{id}/edit(id=${product.id})}" title="Edit">
              <i class="bi bi-pencil"></i>
            </a>
            <button class="btn btn-sm btn-outline-danger" type="button" title="Delete"
                    data-bs-toggle="modal" data-bs-target="#deleteProductModal"
                    th:data-delete-url="@{/admin/products/{id}/delete(id=${product.id})}"
                    th:data-product-name="${product.name}">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
    <div class="text-center py-5" th:if="${page.empty}">
      <i class="bi bi-inbox fs-1 text-secondary"></i>
      <p class="mt-2 text-secondary">No products found</p>
      <a class="btn btn-success" th:href="@{/admin/products/new}">Add product</a>
    </div>
    <div class="card-footer bg-white d-flex flex-wrap align-items-center justify-content-between gap-3"
         th:if="${page.totalPages > 0}">
      <span class="text-secondary small">
        Showing page <span th:text="${page.number + 1}">1</span>
        of <span th:text="${page.totalPages}">1</span>
        (<span th:text="${page.totalElements}">0</span> products)
      </span>
      <nav aria-label="Product pagination" th:if="${page.totalPages > 1}">
        <ul class="pagination pagination-sm mb-0">
          <li class="page-item" th:classappend="${page.first} ? 'disabled'">
            <a class="page-link" th:href="@{/admin/products(name=${name},active=${active},page=${page.number - 1},size=${page.size})}">Previous</a>
          </li>
          <li class="page-item disabled" th:if="${page.number > 2}"><span class="page-link">...</span></li>
          <li class="page-item"
              th:each="pageNumber : ${#numbers.sequence(T(java.lang.Math).max(0, page.number - 2), T(java.lang.Math).min(page.totalPages - 1, page.number + 2))}"
              th:classappend="${pageNumber == page.number} ? 'active'">
            <a class="page-link" th:text="${pageNumber + 1}"
               th:href="@{/admin/products(name=${name},active=${active},page=${pageNumber},size=${page.size})}">1</a>
          </li>
          <li class="page-item disabled" th:if="${page.number < page.totalPages - 3}"><span class="page-link">...</span></li>
          <li class="page-item" th:classappend="${page.last} ? 'disabled'">
            <a class="page-link" th:href="@{/admin/products(name=${name},active=${active},page=${page.number + 1},size=${page.size})}">Next</a>
          </li>
        </ul>
      </nav>
    </div>
  </section>

  <div class="modal fade" id="deleteProductModal" tabindex="-1" aria-labelledby="deleteProductModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="deleteProductModalLabel">Delete product</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          Deactivate <strong data-product-name>this product</strong>?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <form method="post" data-submit-spinner>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn btn-danger" type="submit" data-spinner-target>
              <span class="spinner-border spinner-border-sm d-none me-2" aria-hidden="true"></span>
              <span data-label>Delete</span>
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
