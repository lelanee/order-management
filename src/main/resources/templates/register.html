<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
<head>
  <title>Register</title>
</head>
<body>
<main class="auth-shell">
  <section class="card auth-card">
    <div class="card-body p-4">
      <p class="text-uppercase text-secondary small fw-semibold mb-1">Order Management</p>
      <h1 class="h4 mb-4">Create account</h1>

      <form th:action="@{/register}" method="post" th:object="${registerRequest}" data-submit-spinner>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <input class="form-control" id="username" type="text" autocomplete="username" th:field="*{username}" autofocus>
          <div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" id="email" type="text" autocomplete="email" th:field="*{email}">
          <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" id="password" type="password" autocomplete="new-password" th:field="*{password}">
          <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="fullName">Full name</label>
          <input class="form-control" id="fullName" type="text" autocomplete="name" th:field="*{fullName}">
          <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
        </div>
        <div class="mb-4">
          <label class="form-label" for="phoneNumber">Phone number</label>
          <input class="form-control" id="phoneNumber" type="text" autocomplete="tel" th:field="*{phoneNumber}">
          <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
        </div>
        <button class="btn btn-success w-100" type="submit" data-spinner-target>
          <span class="spinner-border spinner-border-sm d-none me-2" aria-hidden="true"></span>
          <span data-label>Create account</span>
        </button>
      </form>

      <div class="text-center mt-3">
        <a th:href="@{/login}">Back to sign in</a>
      </div>
    </div>
  </section>
</main>
</body>
</html>
