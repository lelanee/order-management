<nav class="navbar navbar-expand-lg site-navbar" xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="https://www.thymeleaf.org/extras/spring-security" th:fragment="navbar"
     sec:authorize="isAuthenticated()">
  <div class="container">
    <a class="navbar-brand brand-711" th:href="@{/shop/products}">
      <span class="brand-mark">7</span><span>Eleven</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
            aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNavbar">
      <div class="navbar-nav ms-auto align-items-lg-center">
        <a class="nav-link" th:href="@{/shop/products}"><i class="bi bi-grid me-1"></i>Shop</a>
        <a class="nav-link position-relative me-lg-2" th:href="@{/shop/cart}">
          <i class="bi bi-cart3 me-1"></i>Cart
          <span class="badge text-bg-primary rounded-pill" th:text="${cartItemCount}">0</span>
        </a>
        <a class="nav-link" sec:authorize="hasRole('ADMIN')" th:href="@{/admin/products}">
          <i class="bi bi-box-seam me-1"></i>Products
        </a>
        <a class="nav-link" sec:authorize="hasRole('ADMIN')" th:href="@{/admin/orders}">
          <i class="bi bi-receipt me-1"></i>Orders
        </a>
        <form th:action="@{/logout}" method="post" class="ms-lg-3">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <button class="btn btn-sm btn-outline-secondary" type="submit">
            <i class="bi bi-box-arrow-right me-1"></i>Logout
          </button>
        </form>
      </div>
    </div>
  </div>
</nav>
