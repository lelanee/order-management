<div class="toast-container position-fixed top-0 end-0 p-3" xmlns:th="http://www.thymeleaf.org" th:fragment="toast">
  <div class="toast align-items-center text-bg-success border-0" role="status" aria-live="polite" aria-atomic="true"
       data-bs-delay="2600" th:if="${successMessage}">
    <div class="d-flex">
      <div class="toast-body"><i class="bi bi-check-circle me-2"></i><span th:text="${successMessage}">Success</span></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
  <div class="toast align-items-center text-bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true"
       data-bs-delay="3600" th:if="${errorMessage}">
    <div class="d-flex">
      <div class="toast-body"><i class="bi bi-exclamation-triangle me-2"></i><span th:text="${errorMessage}">Error</span></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
</div>
