<!doctype html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:fragment="page(title, content)">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:replace="${title}">Order</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/toast :: toast}"></div>
<main th:replace="${content}"></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.querySelectorAll('.toast').forEach((toast) => new bootstrap.Toast(toast).show());

  document.querySelectorAll('form[data-submit-spinner]').forEach((form) => {
    form.addEventListener('submit', () => {
      const button = form.querySelector('button[type="submit"][data-spinner-target]');
      if (!button) return;
      button.disabled = true;
      button.querySelector('.spinner-border')?.classList.remove('d-none');
      button.querySelector('[data-label]')?.classList.add('opacity-75');
    });
  });

  document.querySelectorAll('[data-quantity-control]').forEach((group) => {
    const input = group.querySelector('input');
    group.querySelectorAll('button[data-action]').forEach((button) => {
      button.addEventListener('click', () => {
        const current = Number.parseInt(input.value || '0', 10);
        const next = button.dataset.action === 'inc' ? current + 1 : Math.max(0, current - 1);
        input.value = next;
      });
    });
  });

  const deleteModal = document.getElementById('deleteProductModal');
  if (deleteModal) {
    deleteModal.addEventListener('show.bs.modal', (event) => {
      const button = event.relatedTarget;
      const form = deleteModal.querySelector('form');
      const name = deleteModal.querySelector('[data-product-name]');
      form.action = button.dataset.deleteUrl;
      name.textContent = button.dataset.productName;
    });
  }
</script>
</body>
</html>
