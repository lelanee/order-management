<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
<head>
  <title>Error</title>
</head>
<body>
<main class="container py-5">
  <section class="mx-auto text-center" style="max-width: 680px;">
    <i class="bi bi-exclamation-triangle text-warning display-5"></i>
    <p class="text-uppercase text-secondary small fw-semibold mt-3 mb-1">Something went wrong</p>
    <h1 class="h3 mb-3">
      <span th:text="${status}">500</span>
      <span th:text="${error}">Error</span>
    </h1>
    <p class="text-secondary mb-4" th:text="${message}">Please try again.</p>

    <div class="alert alert-danger text-start" th:if="${fieldErrors != null and !fieldErrors.isEmpty()}">
      <ul class="mb-0">
        <li th:each="entry : ${fieldErrors}" th:text="${entry.key + ': ' + entry.value}">field: message</li>
      </ul>
    </div>

    <div class="d-flex flex-wrap justify-content-center gap-2">
      <a class="btn btn-primary" th:href="@{/}">Go home</a>
      <a class="btn btn-outline-secondary" th:href="@{/shop/products}">Shop products</a>
    </div>
  </section>
</main>
</body>
</html>
