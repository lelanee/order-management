<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/products}">Order Admin</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/swagger-ui.html}">Swagger</a>
            <a class="nav-link" th:href="@{/api/products}">API</a>
        </div>
    </div>
</nav>

<main class="container py-4">
    <section class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
        <div>
            <p class="text-uppercase text-secondary small fw-semibold mb-1">Product Management</p>
            <h1 class="h3 mb-0">Products</h1>
        </div>
        <button class="btn btn-success" type="button" disabled>Add product</button>
    </section>

    <section class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card stat-card">
                <div class="card-body">
                    <p class="text-secondary mb-1">Total products</p>
                    <strong class="fs-3" th:text="${#lists.size(products)}">0</strong>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card stat-card">
                <div class="card-body">
                    <p class="text-secondary mb-1">Active</p>
                    <strong class="fs-3" th:text="${products.?[active == true].size()}">0</strong>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card stat-card">
                <div class="card-body">
                    <p class="text-secondary mb-1">Inactive</p>
                    <strong class="fs-3" th:text="${products.?[active == false].size()}">0</strong>
                </div>
            </div>
        </div>
    </section>

    <section class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Name</th>
                    <th scope="col">Price</th>
                    <th scope="col">Stock</th>
                    <th scope="col">Status</th>
                    <th scope="col" class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(products)}">
                    <td colspan="6" class="text-center text-secondary py-5">No products yet</td>
                </tr>
                <tr th:each="product : ${products}">
                    <td class="text-secondary" th:text="${product.id}">1</td>
                    <td>
                        <div class="fw-semibold" th:text="${product.name}">Product name</div>
                    </td>
                    <td th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' VND'">0 VND</td>
                    <td th:text="${product.stockQuantity}">0</td>
                    <td>
                        <span class="badge text-bg-success" th:if="${product.active}">Active</span>
                        <span class="badge text-bg-secondary" th:unless="${product.active}">Inactive</span>
                    </td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-secondary" type="button" disabled>Detail</button>
                        <button class="btn btn-sm btn-outline-primary" type="button" disabled>Edit</button>
                        <button class="btn btn-sm btn-outline-danger" type="button" disabled>Delete</button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
