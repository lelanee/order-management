<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
<head>
  <title>Checkout</title>
</head>
<body>
<main class="container py-4">
  <section class="mb-4">
    <a class="text-decoration-none" th:href="@{/shop/cart}"><i class="bi bi-arrow-left me-1"></i>Back to cart</a>
    <h1 class="h3 mt-2 mb-0">Checkout</h1>
  </section>

  <form class="row g-4" th:action="@{/shop/checkout}" method="post" th:object="${orderRequest}" data-submit-spinner>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <section class="col-lg-7">
      <div class="card form-card">
        <div class="card-body row g-3">
          <div class="col-md-6">
            <label class="form-label" for="customerName">Customer name</label>
            <input class="form-control" id="customerName" type="text" th:field="*{customerName}">
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('customerName')}" th:errors="*{customerName}"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="customerPhone">Phone</label>
            <input class="form-control" id="customerPhone" type="text" th:field="*{customerPhone}">
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('customerPhone')}" th:errors="*{customerPhone}"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="customerEmail">Email</label>
            <input class="form-control" id="customerEmail" type="text" inputmode="email" th:field="*{customerEmail}">
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('customerEmail')}" th:errors="*{customerEmail}"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="shippingAddress">Shipping address</label>
            <input class="form-control" id="shippingAddress" type="text" th:field="*{shippingAddress}">
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('shippingAddress')}" th:errors="*{shippingAddress}"></div>
          </div>
          <div class="col-12">
            <label class="form-label" for="note">Note</label>
            <textarea class="form-control" id="note" rows="4" th:field="*{note}"></textarea>
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('note')}" th:errors="*{note}"></div>
          </div>
        </div>
        <div class="card-footer bg-white d-flex justify-content-end">
          <button class="btn btn-success" type="submit" data-spinner-target>
            <span class="spinner-border spinner-border-sm d-none me-2" aria-hidden="true"></span>
            <span data-label>Create order</span>
          </button>
        </div>
      </div>
    </section>

    <aside class="col-lg-5">
      <div class="card checkout-summary">
        <div class="card-body">
          <h2 class="h6 mb-3">Order summary</h2>
          <div class="d-flex justify-content-between gap-3 py-2 border-bottom" th:each="item : ${cart.items}">
            <div>
              <div class="fw-semibold" th:text="${item.name}">Product</div>
              <small class="text-secondary" th:text="'Qty ' + ${item.quantity}">Qty 1</small>
            </div>
            <strong th:text="${#numbers.formatDecimal(item.lineTotal, 0, 'POINT', 0, 'NONE')} + ' ₫'">0 ₫</strong>
          </div>
          <div class="d-flex justify-content-between pt-3">
            <span class="text-secondary">Subtotal</span>
            <strong th:text="${#numbers.formatDecimal(cart.subtotal, 0, 'POINT', 0, 'NONE')} + ' ₫'">0 ₫</strong>
          </div>
        </div>
      </div>
    </aside>
  </form>
</main>
</body>
</html>
