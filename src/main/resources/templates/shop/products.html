<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
<head>
  <title>Shop Products</title>
</head>
<body>
<main class="container py-4">
  <section class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
    <div>
      <p class="text-uppercase text-secondary small fw-semibold mb-1">Shop</p>
      <h1 class="h3 mb-0">Products</h1>
    </div>
    <a class="btn btn-outline-primary" th:href="@{/shop/cart}">
      <i class="bi bi-cart3 me-1"></i>View cart
      <span class="badge text-bg-primary ms-1" th:text="${cartItemCount}">0</span>
    </a>
  </section>

  <section class="product-grid" th:if="${!products.isEmpty()}">
    <article class="card product-card" th:each="product : ${products}">
      <div class="position-relative">
        <img class="product-thumb" th:if="${product.imageUrl}" th:src="${product.imageUrl}" alt="">
        <div class="image-placeholder" th:unless="${product.imageUrl}">
          <i class="bi bi-image fs-2"></i>
        </div>
        <span class="badge text-bg-secondary position-absolute top-0 end-0 m-2"
              th:if="${product.stockQuantity == 0}">Out of stock</span>
      </div>
      <div class="card-body d-flex flex-column">
        <h2 class="h6" th:text="${product.name}">Product name</h2>
        <p class="text-secondary small flex-grow-1" th:text="${product.description} ?: 'No description'">Description</p>
        <div class="d-flex justify-content-between align-items-center mb-3">
          <span class="fw-semibold" th:text="${#numbers.formatDecimal(product.price, 0, 'POINT', 0, 'NONE')} + ' ₫'">0 ₫</span>
          <span class="text-secondary small" th:text="'Stock: ' + ${product.stockQuantity}">Stock: 0</span>
        </div>
        <form th:action="@{/shop/cart/add}" method="post" data-submit-spinner>
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <input type="hidden" name="productId" th:value="${product.id}">
          <input type="hidden" name="quantity" value="1">
          <button class="btn btn-success w-100" type="submit" data-spinner-target
                  th:disabled="${product.stockQuantity == 0}">
            <span class="spinner-border spinner-border-sm d-none me-2" aria-hidden="true"></span>
            <span data-label><i class="bi bi-cart-plus me-1"></i>Add to cart</span>
          </button>
        </form>
      </div>
    </article>
  </section>

  <section class="text-center py-5" th:if="${products.isEmpty()}">
    <i class="bi bi-inbox fs-1 text-secondary"></i>
    <p class="mt-2 mb-0 text-secondary">No products available</p>
  </section>
</main>
</body>
</html>
