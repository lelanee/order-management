<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop Products</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-white border-bottom">
  <div class="container">
    <a class="navbar-brand fw-semibold" th:href="@{/shop/products}">Order Shop</a>
    <div class="navbar-nav ms-auto align-items-lg-center">
      <a class="nav-link active" th:href="@{/shop/products}">Shop</a>
      <form th:action="@{/logout}" method="post" class="ms-lg-3">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="btn btn-sm btn-outline-secondary" type="submit">Logout</button>
      </form>
    </div>
  </div>
</nav>

<main class="container py-4">
  <section class="mb-4">
    <p class="text-uppercase text-secondary small fw-semibold mb-1">Create Order</p>
    <h1 class="h3 mb-0">Products</h1>
  </section>

  <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

  <form th:action="@{/shop/orders}" method="post" th:object="${orderRequest}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <section class="product-grid mb-4">
      <article class="card product-card" th:each="product, stat : ${products}">
        <img class="product-thumb" th:if="${product.imageUrl}" th:src="${product.imageUrl}" alt="">
        <div class="image-placeholder" th:unless="${product.imageUrl}">No image</div>
        <div class="card-body">
          <h2 class="h6" th:text="${product.name}">Product name</h2>
          <div class="text-secondary small mb-2" th:text="'Stock: ' + ${product.stockQuantity}">Stock: 0</div>
          <div class="fw-semibold mb-3" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' VND'">0 VND</div>
          <input type="hidden" th:field="*{items[__${stat.index}__].productId}">
          <label class="form-label small" th:for="'quantity-' + ${product.id}">Quantity</label>
          <input class="form-control" th:id="'quantity-' + ${product.id}" type="text" inputmode="numeric"
                 th:field="*{items[__${stat.index}__].quantity}">
        </div>
      </article>
    </section>

    <section class="card form-card">
      <div class="card-body row g-3">
        <div class="col-md-6">
          <label class="form-label" for="customerName">Customer name</label>
          <input class="form-control" id="customerName" type="text" th:field="*{customerName}">
          <div class="text-danger small mt-1" th:if="${#fields.hasErrors('customerName')}" th:errors="*{customerName}"></div>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="customerPhone">Phone</label>
          <input class="form-control" id="customerPhone" type="text" th:field="*{customerPhone}">
          <div class="text-danger small mt-1" th:if="${#fields.hasErrors('customerPhone')}" th:errors="*{customerPhone}"></div>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="customerEmail">Email</label>
          <input class="form-control" id="customerEmail" type="text" inputmode="email" th:field="*{customerEmail}">
          <div class="text-danger small mt-1" th:if="${#fields.hasErrors('customerEmail')}" th:errors="*{customerEmail}"></div>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="shippingAddress">Shipping address</label>
          <input class="form-control" id="shippingAddress" type="text" th:field="*{shippingAddress}">
          <div class="text-danger small mt-1" th:if="${#fields.hasErrors('shippingAddress')}" th:errors="*{shippingAddress}"></div>
        </div>
        <div class="col-12">
          <label class="form-label" for="note">Note</label>
          <textarea class="form-control" id="note" rows="3" th:field="*{note}"></textarea>
          <div class="text-danger small mt-1" th:if="${#fields.hasErrors('note')}" th:errors="*{note}"></div>
        </div>
      </div>
      <div class="card-footer bg-white d-flex justify-content-end">
        <button class="btn btn-success" type="submit">Create order</button>
      </div>
    </section>
  </form>
</main>
</body>
</html>
