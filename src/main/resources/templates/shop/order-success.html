<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
<head>
  <title>Order created</title>
</head>
<body>
<main class="container py-4">
  <section class="card">
    <div class="card-body">
      <p class="text-uppercase text-secondary small fw-semibold mb-1">Order Created</p>
      <h1 class="h3">Order #<span th:text="${order.id}">1</span></h1>
      <p class="text-secondary mb-4">Your order is pending admin review.</p>

      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
          <tr>
            <th>Product</th>
            <th>Quantity</th>
            <th>Unit price</th>
            <th>Line total</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="item : ${order.items}">
            <td th:text="${item.productName}">Product</td>
            <td th:text="${item.quantity}">1</td>
            <td th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'POINT', 0, 'NONE')} + ' ₫'">0 ₫</td>
            <td th:text="${#numbers.formatDecimal(item.lineTotal, 0, 'POINT', 0, 'NONE')} + ' ₫'">0 ₫</td>
          </tr>
          </tbody>
        </table>
      </div>

      <div class="d-flex justify-content-between align-items-center border-top pt-3">
        <strong>Total</strong>
        <strong th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'POINT', 0, 'NONE')} + ' ₫'">0 ₫</strong>
      </div>

      <div class="d-flex flex-wrap gap-2 mt-4">
        <a class="btn btn-success" th:href="@{/shop/products}">
          <i class="bi bi-arrow-left me-1"></i>Continue shopping
        </a>
        <a class="btn btn-outline-secondary" th:href="@{/shop/cart}">
          <i class="bi bi-cart3 me-1"></i>View cart
        </a>
      </div>
    </div>
  </section>
</main>
</body>
</html>
