<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order created</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-white border-bottom">
  <div class="container">
    <a class="navbar-brand fw-semibold" th:href="@{/shop/products}">Order Shop</a>
    <div class="navbar-nav ms-auto align-items-lg-center">
      <a class="nav-link" th:href="@{/shop/products}">Shop</a>
      <form th:action="@{/logout}" method="post" class="ms-lg-3">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="btn btn-sm btn-outline-secondary" type="submit">Logout</button>
      </form>
    </div>
  </div>
</nav>

<main class="container py-4">
  <section class="card">
    <div class="card-body">
      <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
      <p class="text-uppercase text-secondary small fw-semibold mb-1">Order Created</p>
      <h1 class="h3">Order #<span th:text="${order.id}">1</span></h1>
      <p class="text-secondary mb-4">Your order is pending admin review.</p>

      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
          <tr>
            <th>Product</th>
            <th>Quantity</th>
            <th>Unit price</th>
            <th>Line total</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="item : ${order.items}">
            <td th:text="${item.productName}">Product</td>
            <td th:text="${item.quantity}">1</td>
            <td th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'COMMA', 0, 'POINT')} + ' VND'">0 VND</td>
            <td th:text="${#numbers.formatDecimal(item.lineTotal, 0, 'COMMA', 0, 'POINT')} + ' VND'">0 VND</td>
          </tr>
          </tbody>
        </table>
      </div>

      <div class="d-flex justify-content-between align-items-center border-top pt-3">
        <strong>Total</strong>
        <strong th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VND'">0 VND</strong>
      </div>

      <a class="btn btn-success mt-4" th:href="@{/shop/products}">Create another order</a>
    </div>
  </section>
</main>
</body>
</html>
