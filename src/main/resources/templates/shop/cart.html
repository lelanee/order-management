<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
<head>
  <title>Your Cart</title>
</head>
<body>
<main class="container py-4">
  <section class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
    <div>
      <p class="text-uppercase text-secondary small fw-semibold mb-1">Cart</p>
      <h1 class="h3 mb-0">Your cart</h1>
    </div>
    <a class="btn btn-outline-secondary" th:href="@{/shop/products}">
      <i class="bi bi-arrow-left me-1"></i>Continue shopping
    </a>
  </section>

  <section class="card" th:if="${!cart.empty}">
    <div class="table-responsive">
      <table class="table align-middle mb-0">
        <thead>
        <tr>
          <th>Product</th>
          <th>Price</th>
          <th style="width: 180px">Quantity</th>
          <th class="text-end">Line total</th>
          <th class="text-end">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${cart.items}">
          <td>
            <div class="d-flex align-items-center gap-3">
              <img class="cart-thumb" th:if="${item.imageUrl}" th:src="${item.imageUrl}" alt="">
              <div class="cart-thumb image-placeholder" th:unless="${item.imageUrl}">
                <i class="bi bi-image"></i>
              </div>
              <div>
                <div class="fw-semibold" th:text="${item.name}">Product</div>
                <small class="text-secondary" th:text="'Stock: ' + ${item.stockQuantity}">Stock: 0</small>
              </div>
            </div>
          </td>
          <td th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'POINT', 0, 'NONE')} + ' ₫'">0 ₫</td>
          <td>
            <form class="d-flex gap-2" th:action="@{/shop/cart/update}" method="post" data-submit-spinner>
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <input type="hidden" name="productId" th:value="${item.productId}">
              <div class="input-group input-group-sm quantity-control" data-quantity-control>
                <button class="btn btn-outline-secondary" type="button" data-action="dec">-</button>
                <input class="form-control text-center" name="quantity" type="text" inputmode="numeric"
                       th:value="${item.quantity}">
                <button class="btn btn-outline-secondary" type="button" data-action="inc">+</button>
              </div>
              <button class="btn btn-sm btn-outline-primary" type="submit" data-spinner-target>
                <span class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span>
                <span data-label>Update</span>
              </button>
            </form>
          </td>
          <td class="text-end fw-semibold" th:text="${#numbers.formatDecimal(item.lineTotal, 0, 'POINT', 0, 'NONE')} + ' ₫'">0 ₫</td>
          <td class="text-end">
            <form th:action="@{/shop/cart/remove}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <input type="hidden" name="productId" th:value="${item.productId}">
              <button class="btn btn-sm btn-outline-danger" type="submit" title="Remove">
                <i class="bi bi-trash"></i>
              </button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
    <div class="card-footer bg-white d-flex flex-wrap justify-content-between align-items-center gap-3">
      <div>
        <span class="text-secondary">Subtotal</span>
        <strong class="ms-2" th:text="${#numbers.formatDecimal(cart.subtotal, 0, 'POINT', 0, 'NONE')} + ' ₫'">0 ₫</strong>
      </div>
      <a class="btn btn-success" th:href="@{/shop/checkout}">
        Checkout <i class="bi bi-arrow-right ms-1"></i>
      </a>
    </div>
  </section>

  <section class="text-center py-5" th:if="${cart.empty}">
    <i class="bi bi-cart3 fs-1 text-secondary"></i>
    <p class="mt-2 text-secondary">Your cart is empty</p>
    <a class="btn btn-success" th:href="@{/shop/products}">Browse products</a>
  </section>
</main>
</body>
</html>
