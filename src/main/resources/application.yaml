spring:
  application:
    name: order
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: ${DB_USER:order_user}
    password: ${DB_PASSWORD:order_password}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

springdoc:
  open-api:
    info:
      title: Order Management API
      version: "1.0"
      description: APIs for managing products and orders
